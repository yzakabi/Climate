<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Climate</title>
    <link rel="stylesheet" href="../css/event_create.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle" />
</head>



      
<body>
    <header>
        <img src="../img/logo.png" alt="" id="icon">
        <nav>
            <ul class="nav-menu">
                <li><a href="index.html">Página Principal</a></li>
                <li><a href="news_page.html">Notícias</a></li>
                <li><a href="event_create.html">Comunidade</a></li>
                <li><a href="contacts.html">Contatos</a></li>
            </ul>
        </nav>
        <button id="user">
            <span class="material-symbols-outlined">account_circle</span>
        </button>
    </header>

    <div class="container">
    <h2>Registrar Evento</h2>

    <form>
      <label for="tipo">Tipo de Evento</label>
      <select id="tipo" name="tipo">
        <option value="">Selecione</option>
        <option value="enchente">Enchente</option>
        <option value="deslizamento">Deslizamento</option>
        <option value="queimada">Queimada</option>
        <option value="outro">Outro</option>
      </select>

      <label for="descricao">Descrição do Evento</label>
      <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva o que aconteceu..."></textarea>

      <label for="local">Local do Evento</label>
      <input type="text" id="local" name="local" placeholder="Ex: Rua das Flores, São Paulo - SP">

      <button class="enviar">Enviar Registro</button>
    </form>
  </div>


</body>
</html>
